name: Build Athena

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone source
        run: |
          git clone --depth 1 -b 25.12-nss https://github.com/LiBwrt/openwrt-6.x openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp .config openwrt/.config
          cd openwrt
          make defconfig
          grep -E "DEVICE_jdcloud|PACKAGE_dockerd|PACKAGE_kmod-veth" .config || true

      - name: Download
        run: |
          cd openwrt
          make download -j8 || true

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: athena-firmware
          path: openwrt/bin/targets/**/*.bin
