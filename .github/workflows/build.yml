name: Build Athena LibWrt

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repository'
        required: false
        default: 'https://github.com/LiBwrt/openwrt-6.x'
      source_branch:
        description: 'Source branch'
        required: false
        default: '25.12-nss'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pip rsync swig unzip zlib1g-dev \
            file wget cpio time ecj fastjar java-propose-classpath

      - name: Clone source
        run: |
          git clone --depth 1 -b ${{ github.event.inputs.source_branch }} \
            ${{ github.event.inputs.source_repo }} openwrt
          echo "源码大小: $(du -sh openwrt)"

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        run: |
          cp $GITHUB_WORKSPACE/.config openwrt/.config
          cd openwrt
          make defconfig
          echo "=== 关键配置 ==="
          grep -E "DEVICE_jdcloud|PACKAGE_dockerd|PACKAGE_kmod-veth" .config || true

      - name: Download packages
        run: |
          cd openwrt
          make download -j8 || true

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tail -100

      - name: Find firmware
        run: |
          find openwrt/bin/targets -name "*.bin" -o -name "*.itb" | head -20

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: athena-libwrt-firmware
          path: |
            openwrt/bin/targets/**/*.bin
            openwrt/bin/targets/**/*.itb
          retention-days: 30
