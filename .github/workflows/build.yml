name: Build Athena 6.18

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget cpio

      - name: Clone ImmortalWrt master (6.18)
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo "内核:" && grep KERNEL_PATCHVER target/linux/qualcommax/Makefile

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
            openwrt/.ccache
          key: owrt-618-v1
          restore-keys: |
            owrt-618-

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_TARGET_MULTI_PROFILE=n

          # ===== LuCI 完整界面 (关键!) =====
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-lib-uqr=y

          # ===== LuCI 中文 =====
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y

          # ===== Web 服务器 (关键!) =====
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_uhttpd-mod-ucode=y
          CONFIG_PACKAGE_cgi-io=y
          CONFIG_PACKAGE_px5g-mbedtls=y

          # ===== ucode 运行时 + 全部模块 (关键!) =====
          CONFIG_PACKAGE_ucode=y
          CONFIG_PACKAGE_ucode-mod-digest=y
          CONFIG_PACKAGE_ucode-mod-fs=y
          CONFIG_PACKAGE_ucode-mod-html=y
          CONFIG_PACKAGE_ucode-mod-log=y
          CONFIG_PACKAGE_ucode-mod-math=y
          CONFIG_PACKAGE_ucode-mod-nl80211=y
          CONFIG_PACKAGE_ucode-mod-rtnl=y
          CONFIG_PACKAGE_ucode-mod-ubus=y
          CONFIG_PACKAGE_ucode-mod-uci=y
          CONFIG_PACKAGE_ucode-mod-uclient=y
          CONFIG_PACKAGE_ucode-mod-uloop=y

          # ===== rpcd 全部模块 =====
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-file=y
          CONFIG_PACKAGE_rpcd-mod-iwinfo=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_rpcd-mod-rpcsys=y
          CONFIG_PACKAGE_rpcd-mod-rrdns=y
          CONFIG_PACKAGE_rpcd-mod-ucode=y

          # ===== Docker =====
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker-compose=y
          CONFIG_PACKAGE_containerd=y
          CONFIG_PACKAGE_runc=y
          CONFIG_PACKAGE_tini=y
          CONFIG_PACKAGE_libseccomp=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-ipt-nat6=y
          CONFIG_PACKAGE_kmod-ipt-physdev=y
          CONFIG_PACKAGE_kmod-nf-ipvs=y
          CONFIG_PACKAGE_kmod-br-netfilter=y
          CONFIG_PACKAGE_kmod-dummy=y

          # ===== 基础工具 =====
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_coreutils-stat=y
          CONFIG_PACKAGE_httping=y
          CONFIG_PACKAGE_uclient-fetch=y
          CONFIG_PACKAGE_jsonfilter=y

          # ===== 网络 =====
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          # ===== 防火墙 (iptables 版, 兼容 Docker) =====
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          CONFIG_PACKAGE_iptables-mod-conntrack-extra=y
          CONFIG_PACKAGE_iptables-mod-ipopt=y
          CONFIG_PACKAGE_firewall=y
          # CONFIG_PACKAGE_firewall4 is not set
          # CONFIG_PACKAGE_nftables-json is not set

          # ===== 内核 =====
          CONFIG_KERNEL_DEVTMPFS=y
          CONFIG_KERNEL_DEVTMPFS_MOUNT=y
          CONFIG_KERNEL_TMPFS=y
          CONFIG_KERNEL_BLK_DEV=y
          CONFIG_KERNEL_EXT4=y
          CONFIG_KERNEL_SQUASHFS=y
          CONFIG_KERNEL_SQUASHFS_XZ=y
          CONFIG_KERNEL_OVERLAY_FS=y
          CONFIG_KERNEL_PROC_FS=y
          CONFIG_KERNEL_SYSFS=y
                    EOF
          make defconfig
          echo "=== 关键配置 ==="
          grep -E "DEVICE_jdcloud|PACKAGE_dockerd|PACKAGE_kmod-veth|PACKAGE_firewall|LINUX_6" .config || true


      - name: Patch kernel config for DEVTMPFS
        run: |
          cd openwrt
          echo "=== 修改前 ==="
          grep -n "DEVTMPFS" target/linux/generic/config-6.18 | head -5
          # 强制开启 DEVTMPFS_MOUNT
          sed -i 's|^# CONFIG_DEVTMPFS_MOUNT is not set|CONFIG_DEVTMPFS_MOUNT=y|' target/linux/generic/config-6.18
          grep -q "^CONFIG_DEVTMPFS_MOUNT=y" target/linux/generic/config-6.18 || echo "CONFIG_DEVTMPFS_MOUNT=y" >> target/linux/generic/config-6.18
          sed -i 's|^# CONFIG_DEVTMPFS is not set|CONFIG_DEVTMPFS=y|' target/linux/generic/config-6.18
          grep -q "^CONFIG_DEVTMPFS=y" target/linux/generic/config-6.18 || echo "CONFIG_DEVTMPFS=y" >> target/linux/generic/config-6.18
          echo "=== 修改后 ==="
          grep -n "DEVTMPFS" target/linux/generic/config-6.18 | head -5


      - name: Patch preinit to mount devtmpfs early
        run: |
          cd openwrt
          echo '' | base64 -d > package/base-files/files/lib/preinit/79_mount_devtmpfs
          chmod +x package/base-files/files/lib/preinit/79_mount_devtmpfs
          echo "=== Created ==="
          cat package/base-files/files/lib/preinit/79_mount_devtmpfs

      - name: Patch fstab for overlay
        run: |
          cd openwrt
          mkdir -p package/base-files/files/etc/config
          echo '' | base64 -d > package/base-files/files/etc/config/fstab
          echo "=== fstab 内容 ==="
          cat package/base-files/files/etc/config/fstab

      - name: Download packages

        run: |
          cd openwrt
          make download -j8 || true

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
        run: |
          cd openwrt
          set -o pipefail
          make -j$(nproc) 2>&1 | tee /tmp/build.log | tail -100
          echo "=== 编译结束，检查产物 ==="
          find bin/targets -name "*.bin" 2>/dev/null | head -5

      - name: Show errors if failed
        if: failure()
        run: |
          echo "=== 错误摘要 ==="
          grep -iE "ERROR:|failed to build|make.*Error" /tmp/build.log 2>/dev/null | tail -30
          echo "=== 最后一个失败的包 ==="
          grep -B2 "failed to build" /tmp/build.log 2>/dev/null | tail -10

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: athena-618-firmware
          path: openwrt/bin/targets/**/*.bin
